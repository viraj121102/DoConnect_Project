<div class="ask-container d-flex justify-content-center align-items-center">
  <div class="ask-card card shadow-lg p-4">
    <h2 class="text-center mb-4">
      <i class="fas fa-pen"></i> Ask a Question
    </h2>

    <form (ngSubmit)="submit()">
      <!-- Title -->
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input
          id="title"
          [(ngModel)]="title"
          name="title"
          placeholder="Enter your question title"
          class="form-control"
          required
        />
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label for="text" class="form-label">Description</label>
        <textarea
          id="text"
          [(ngModel)]="text"
          name="text"
          rows="5"
          class="form-control"
          placeholder="Describe your question in detail..."
          required
        ></textarea>
      </div>

      <!-- File Upload -->
      <div class="mb-3">
        <label for="file" class="form-label">Attach Image (optional)</label>
        <input
          id="file"
          type="file"
          class="form-control"
          (change)="onFileSelected($event)"
        />
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary w-100">
        <i class="fas fa-paper-plane"></i> Submit
      </button>
    </form>
  </div>
</div>
